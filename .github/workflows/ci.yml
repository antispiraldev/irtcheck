# Four agents work a wave concurrently, so this workflow has two jobs to do:
# catch a bad branch, and catch a bad *combination* of branches. The second is
# what `contracts` is for, and it is why that job runs first and carries its own
# name in the PR checks list.
#
# On pull_request rather than on every branch push, so a PR gets one run instead
# of two. master is covered as well, because a merge can produce a state neither
# parent had — which is exactly the case `contracts` exists to catch.
name: ci

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

# A newer commit on the same PR makes the running check irrelevant, so cancel.
# A newer commit on master does not: each merge is a distinct state someone may
# need to bisect to, and cancelling means the run that would have caught a bad
# merge silently never finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The merge-time race check. Two branches that are each green can still break
  # master together: both bumping SCHEMA_VERSION, two commands claiming one flag
  # with different meanings, a module growing a top-level `import torch`. No
  # single PR can get any of those wrong on its own, so no review catches them.
  #
  # It runs on the light dependency set — that is deliberate, since one of the
  # things it asserts is that the package imports without torch at all.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install without torch or pyro
        run: |
          pip install typer rich numpy scipy pytest
          pip install -e . --no-deps
      - name: Contracts hold
        run: python -m pytest tests/test_contracts.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  # The suite that does not need a fitter — which is most of it, because synth.py
  # fabricates valid artifacts and the analysis commands read them. Installing
  # *without* torch is the point: it is what proves `report` and `select` run on
  # a machine that has never seen it. A top-level `import torch` anywhere outside
  # irtcheck/fit/ fails here, from the outside, in addition to failing the AST
  # check in contracts.
  tests-light:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full supported range. py-irt's <3.12 ceiling is the reason this
        # matrix exists at all — see docs/build-plan.html, finding F-1. Owning
        # the Pyro model instead of depending on py-irt is what buys 3.12 and
        # 3.13, and this matrix is what stops that quietly regressing.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install without torch or pyro
        run: |
          pip install typer rich numpy scipy pytest
          pip install -e . --no-deps
      - name: Run the suite that does not need a fitter
        run: python -m pytest -q -m "not slow"

  # The fitting tests: slow, stochastic, and the only ones that need torch.
  # Seeded and CPU-only — see CLAUDE.md → Testing a stochastic fit. Split out so
  # a failure here is legible as "the model regressed" rather than being buried
  # in a suite that also covers argument parsing.
  tests-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The CPU wheel. The default index pulls the CUDA build, which is ~2.5 GB
      # of driver payload this runner has no GPU to use.
      - name: Install with the CPU torch wheel
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e '.[dev]'
      - name: Fitting tests
        run: python -m pytest -q -m slow

  # The guard is what keeps four concurrent agents out of each other's trees, so
  # a broken guard is a repo-wide hazard rather than a local inconvenience. Its
  # suite is dependency-free and builds a throwaway repo in a temp dir.
  git-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git guard behaves
        run: python3 .claude/hooks/test_git_guard.py

  # A wheel that does not build, or that ships crosscheck/ or docs/, is only
  # discovered at release time otherwise.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: The wheel carries the package and nothing else
        run: |
          python - <<'EOF'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.startswith("irtcheck/") for n in names), names
          leaked = [n for n in names if n.startswith(("crosscheck/", "docs/", ".claude/"))]
          assert not leaked, f"wheel leaked non-package files: {leaked}"
          print(f"{wheel.name}: {len(names)} entries, clean")
          EOF
